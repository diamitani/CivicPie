# CivicPie Data Agent — source registry (PRD §4, priority order)
#
# Adding a source = one entry here + one adapter file in adapters/<module>.py.
# No pipeline rewrites.
#
# Fields:
#   id             stable source id (also used as record.source_id)
#   name           human-readable label
#   base_url       homepage of the source (provenance / robots scope)
#   cadence        weekly | monthly  (informational; the cron runs weekly)
#   adapter        adapters/<adapter>.py module name (no .py)
#   rate_limit_rps max requests/second for this source
#   respect_robots honor robots.txt (false only for official JSON APIs that
#                  publish one or document crawler policy)
#   auth_env       env var holding the API key, or null; when set and the
#                  env var is missing the source is SKIPPED gracefully
#   enabled        false = skipped (e.g. feed URL not confirmed yet)

sources:
  - id: chicago-council-official
    name: "Chicago City Council official site (chicago.gov)"
    base_url: "https://www.chicago.gov/city/en/depts/mayor/supp_info/city_council.html"
    cadence: weekly
    adapter: chicago_council
    rate_limit_rps: 0.5
    respect_robots: true
    auth_env: null
    enabled: true

  - id: il-sbe
    name: "Illinois State Board of Elections (elections.il.gov)"
    base_url: "https://www.elections.il.gov/"
    cadence: weekly
    adapter: il_sbe
    rate_limit_rps: 0.5
    respect_robots: true
    auth_env: null
    enabled: true

  - id: cta-board
    name: "CTA Board — meeting notices, agendas & minutes (transitchicago.com)"
    base_url: "https://www.transitchicago.com/board/notices-agendas-minutes/"
    cadence: weekly
    adapter: cta_board
    rate_limit_rps: 0.5
    respect_robots: true
    auth_env: null
    enabled: true
    note: "Listing page allowed by robots.txt (only ?pg= pagination is disallowed — never followed). AI_GATEWAY_API_KEY enables optional model normalization; DDG search is the discovery fallback."

  - id: north-liberty-civicclerk
    name: "North Liberty CivicClerk meetings/agendas"
    base_url: "https://www.northlibertyiowa.org/"
    cadence: weekly
    adapter: civicclerk
    rate_limit_rps: 1.0
    respect_robots: true
    auth_env: null
    enabled: false
    note: "Adapter stubbed until Patrick confirms the CivicClerk feed URL."

  - id: fec
    name: "FEC API — federal candidates/committees"
    base_url: "https://api.open.fec.gov/v1/"
    cadence: weekly
    adapter: fec
    rate_limit_rps: 1.0
    respect_robots: false
    auth_env: FEC_API_KEY
    enabled: true
    note: "Skipped gracefully when FEC_API_KEY is not set."

  - id: openstates
    name: "OpenStates API — state legislators"
    base_url: "https://v3.openstates.org/"
    cadence: weekly
    adapter: openstates
    rate_limit_rps: 1.0
    respect_robots: false
    auth_env: OPENSTATES_API_KEY
    enabled: true
    note: "Skipped gracefully when OPENSTATES_API_KEY is not set."

  - id: census
    name: "US Census API — population/geography refresh"
    base_url: "https://api.census.gov/data/"
    cadence: monthly
    adapter: census
    rate_limit_rps: 2.0
    respect_robots: false
    auth_env: null
    enabled: true
